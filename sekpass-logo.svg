<svg viewBox="0 0 600 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SekPass logo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf6fb"/>
      <stop offset="100%" stop-color="#cdeaf5"/>
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8fd3ec"/>
      <stop offset="100%" stop-color="#5bb8dd"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="600" height="160" rx="20" fill="url(#bgGrad)"/>

  <!-- Shield/lock icon -->
  <g transform="translate(40,32)">
    <rect x="18" y="42" width="60" height="48" rx="8" fill="url(#lockGrad)"/>
    <path d="M28 42 V28 a20 20 0 0 1 40 0 V42" fill="none" stroke="#5bb8dd" stroke-width="8" stroke-linecap="round"/>
    <circle cx="48" cy="64" r="7" fill="#eaf6fb"/>
    <rect x="45" y="64" width="6" height="14" rx="3" fill="#eaf6fb"/>
  </g>

  <!-- Wordmark -->
  <text x="140" y="98" font-family="'Segoe UI', Arial, sans-serif" font-size="56" font-weight="700" fill="#2e7ea8" letter-spacing="1">
    Sek<tspan fill="#5bb8dd">Pass</tspan>
  </text>
</svg>
